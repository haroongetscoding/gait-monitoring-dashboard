<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Gait Monitoring Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F7F8;--card:#fff;--line:#DCE6E9;--ink:#16323B;--mut:#64808A;--side:#0E3B47;--teal:#12818C;--tealL:#E1F2F3;--grn:#2E9B6A;--grnL:#E3F4EC;--amb:#D9822B;--ambL:#FDF1E1;--red:#C4453C;--grey:#A9B7BC;--sh:0 1px 2px rgba(14,59,71,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1B20;--card:#17262C;--line:#26383F;--ink:#E4EEF0;--mut:#8FA7AF;--side:#0A2A33;--tealL:#173A40;--grnL:#183A2D;--ambL:#3B2C17}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.4 Inter,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{width:200px;background:var(--side);color:#cfe3e6;display:flex;flex-direction:column;padding:14px 10px;flex:none}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:600;font-size:15px;padding:2px 6px 16px}
.brand i{width:30px;height:30px;border-radius:7px;background:var(--teal);display:grid;place-items:center}
aside button{all:unset;cursor:pointer;display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:6px;color:#cfe3e6;margin-bottom:2px}
aside button:hover{background:rgba(255,255,255,.08)}
aside button.on{background:var(--teal);color:#fff;font-weight:500}
.sp{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;padding:11px 22px;background:var(--card);border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px 10px}
.d{width:8px;height:8px;border-radius:50%;background:var(--grn);display:inline-block}.d.g{background:var(--grey)}.d.a{background:var(--amb)}
section{flex:1;overflow:auto;padding:18px 22px;min-height:0}
h2{font-size:18px;font-weight:600}.sub{color:var(--mut);margin:2px 0 14px}
.grid{display:grid;gap:12px}.k4{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:2fr 1fr}.two2{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px;box-shadow:var(--sh);margin-bottom:12px}
.grid>.card{margin-bottom:0}.grid{margin-bottom:12px}
.card h3{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px}
.kpi{border-top:3px solid var(--teal)}.kpi.a{border-top-color:var(--amb)}.kpi.g{border-top-color:var(--grn)}
.kpi b{font-size:26px;font-weight:600;display:block}.kpi span{color:var(--mut);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span:first-child{color:var(--mut)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border:0}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:500;background:var(--tealL);color:var(--teal)}
.tag.f{background:var(--ambL);color:var(--amb)}.tag.ok{background:var(--grnL);color:var(--grn)}
.btn{all:unset;cursor:pointer;background:var(--teal);color:#fff;padding:6px 12px;border-radius:6px;font-weight:500}.btn:hover{opacity:.9}
.btn.o{background:transparent;color:var(--teal);border:1px solid var(--teal);padding:4px 10px}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.fl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.fl label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.big{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.alert{background:var(--ambL);border:1px solid var(--amb);color:#8a5116;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-weight:500}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}.tog button{all:unset;cursor:pointer;padding:5px 12px;font-size:12px;background:var(--card)}.tog button.on{background:var(--teal);color:#fff}
.feed div{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}.feed div:last-child{border:0}.feed time{color:var(--mut);width:64px;font-variant-numeric:tabular-nums}
.tl{border-left:2px solid var(--line);margin-left:6px}.tl div{position:relative;padding:0 0 11px 16px}.tl div:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--teal);border:2px solid var(--card)}.tl .f:before{background:var(--amb)}.tl .c:before{background:var(--grn)}.tl time{color:var(--mut);margin-right:8px;font-variant-numeric:tabular-nums}
.arch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;margin-bottom:6px}.arch span{background:var(--tealL);color:var(--teal);padding:4px 8px;border-radius:5px;font-weight:500}.arch em{color:var(--mut);font-style:normal}
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:-4px 0 14px rgba(14,59,71,.15);padding:18px;transform:translateX(105%);transition:transform .2s;overflow:auto;z-index:5}.drawer.on{transform:none}
.drawer h2{display:flex;justify-content:space-between;margin-bottom:12px}.x{all:unset;cursor:pointer;font-size:20px;color:var(--mut)}
footer{padding:7px 22px;font-size:11px;color:var(--mut);border-top:1px solid var(--line);background:var(--card)}
svg text{fill:var(--mut);font:10.5px Inter,sans-serif}
@media(max-width:820px){aside{width:56px}aside b,.brand span{display:none}.k4{grid-template-columns:1fr 1fr}.two,.two2,.three{grid-template-columns:1fr}}
</style></head><body>
<aside>
<div class="brand"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-7 4 14 3-7h6"/></svg></i><span>Gait Monitor</span></div>
<button data-p="ov" class="on">▦ <b>Overview</b></button>
<button data-p="mo">◉ <b>Real-Time Monitoring</b></button>
<button data-p="ev">☰ <b>Gait Events</b></button>
<button data-p="se">▤ <b>Session Analysis</b></button>
<div class="sp"></div>
<button data-p="ds">▣ <b>Device Status</b></button>
<button data-p="st">⚙ <b>Settings</b></button>
</aside>
<div class="main">
<header><h1>Gait Monitoring Dashboard</h1><div class="pills"><span class="pill"><i class="d"></i>Device Connected</span><span class="pill"><i class="d"></i>Firebase Synced</span><span class="pill">Last Sync: 10:42 AM</span></div></header>
<section id="v"></section>
<footer>Academic proof-of-concept for gait-event monitoring. Not intended for medical diagnosis or treatment.</footer>
</div>
<div class="drawer" id="dr"></div>
<script>
const E=[
["GE-018","06 Oct 2026","10:38:24","Possible FoG",2.8,"Reduced Movement","Activated","S024"],
["GE-017","06 Oct 2026","10:21:09","Gait Anomaly",1.4,"Irregular Movement","Activated","S024"],
["GE-016","06 Oct 2026","09:58:42","Possible FoG",3.1,"Reduced Movement","Activated","S023"],
["GE-015","06 Oct 2026","09:40:15","Gait Anomaly",1.1,"Irregular Movement","Activated","S023"],
["GE-014","05 Oct 2026","16:12:03","Possible FoG",2.2,"Reduced Movement","Activated","S022"],
["GE-013","05 Oct 2026","15:47:30","Gait Anomaly",0.9,"Irregular Movement","Not Activated","S022"]];
const $=s=>document.querySelector(s),v=$("#v");
const ty=t=>`<span class="tag ${t=="Possible FoG"?"f":""}">${t}</span>`;
const cue=c=>`<span class="tag ${c=="Activated"?"ok":""}" ${c!="Activated"?'style="background:var(--bg);color:var(--mut)"':""}>${c}</span>`;
const rec='<span class="tag ok">Recorded</span>';
let state="n",F={d:"All Dates",t:"All Events",s:"All Sessions",c:"All"};
function sel(id,o,val){return `<select id="${id}">${o.map(x=>`<option ${x==val?"selected":""}>${x}</option>`).join("")}</select>`}
function dev(){return [["Device","ESP32-GAIT-01"],["ESP32","Connected"],["MPU6050","Active"],["Wi-Fi","Connected"],["Firebase","Synced"],["Cue System","Ready"],["Battery","78%"]].map((r,i)=>`<div class="row"><span>${r[0]}</span><span>${i?`<i class="d ${r[1]=="78%"?"a":""}"></i> `:""}${r[1]}</span></div>`).join("")}
function evChart(){const hr=["08:00","09:00","10:00","11:00"],cnt=[[0,0],[1,1],[2,1],[0,0]];
let s=`<svg viewBox="0 0 520 190" width="100%"><g stroke="var(--line)">`;
for(let i=0;i<=3;i++)s+=`<line x1="40" x2="510" y1="${150-i*40}" y2="${150-i*40}"/>`;
s+=`</g>`;for(let i=0;i<=3;i++)s+=`<text x="26" y="${154-i*40}">${i}</text>`;
hr.forEach((h,i)=>{const x=95+i*115;s+=`<text x="${x-14}" y="170">${h}</text>`;let n=0;
for(let k=0;k<cnt[i][0];k++)s+=`<circle cx="${x}" cy="${130-(n++)*40}" r="7" fill="var(--amb)"/>`;
for(let k=0;k<cnt[i][1];k++)s+=`<circle cx="${x}" cy="${130-(n++)*40}" r="7" fill="var(--teal)"/>`;});
return s+`<text x="4" y="14">Event Count</text><text x="460" y="186">Time (06 Oct)</text></svg><div class="sub" style="margin:4px 0 0"><i class="d a"></i> Possible FoG &nbsp; <i class="d" style="background:var(--teal)"></i> Gait Anomaly</div>`}
function recent(n){return `<div class="tw"><table><tr><th>Time</th><th>Event Type</th><th>Duration</th><th>Movement State</th><th>Cue Status</th><th>Recording Status</th></tr>${E.slice(0,n).map(e=>`<tr><td>${e[2]}</td><td>${ty(e[3])}</td><td>${e[4]} sec</td><td>${e[5]}</td><td>${cue(e[6])}</td><td>${rec}</td></tr>`).join("")}</table></div>`}
const P={
ov:()=>`<h2>System Overview</h2><p class="sub">Summary of recorded gait events and wearable device status.</p>
<div class="grid k4"><div class="card kpi"><span>Monitoring Sessions</span><b>24</b></div><div class="card kpi g"><span>Total Detected Events</span><b>18</b></div><div class="card kpi a"><span>Possible FoG Events</span><b>7</b></div><div class="card kpi"><span>Last Detected Event</span><b>10:38 AM</b></div></div>
<div class="grid two"><div class="card"><h3>Detected Events by Time</h3>${evChart()}</div><div class="card"><h3>Wearable Device Status</h3>${dev()}</div></div>
<div class="card"><h3>Recent Detected Events</h3>${recent(3)}<div style="margin-top:10px"><button class="btn" onclick="go('ev')">View All Events</button></div></div>`,
mo:()=>{const d=state=="d";return `<h2>Real-Time Gait Event Monitoring</h2><p class="sub">Monitor the wearable system status and newly detected gait events.</p>
<div class="tog"><button class="${d?"":"on"}" onclick="state='n';go('mo')">Normal</button><button class="${d?"on":""}" onclick="state='d';go('mo')">Event Detected</button></div>
<div class="grid two2"><div class="card"><h3>Monitoring Status</h3><div class="big"><i class="d"></i>Monitoring Active</div><div style="margin-top:8px">${[["Device","ESP32-GAIT-01"],["Sensor","Active"],["Connection","Connected"],["Firebase","Synced"],["Cue System",d?"Active":"Ready"]].map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div></div>
<div class="card" style="${d?"border-color:var(--amb)":""}"><h3>Current System State</h3>${d?'<div class="alert">Possible gait anomaly detected.</div>':""}
${(d?[["Movement Status","Possible Gait Anomaly"],["Latest Detection","Possible FoG Event"],["Event Time","10:42:16 AM"],["Cue Status","Activated"]]:[["Movement Status","Monitoring"],["Last Event","10:38 AM"],["Cue Status","Standby"]]).map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}</div></div>
<div class="grid two2"><div class="card"><h3>Latest Detected Event</h3>${(d?[["Event","Possible FoG"],["Timestamp","10:42:16 AM"],["Duration","2.6 seconds"]]:[["Event","Possible FoG"],["Timestamp","10:38:24 AM"],["Duration","2.8 seconds"]]).concat([["Movement State","Reduced Movement"],["Sensory Cue","Activated"],["Cloud Recording","Recorded"]]).map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>
<div class="card"><h3>Recent Event Feed</h3><div class="feed">${(d?[["10:42:16","Possible FoG detected","Cue activated"]]:[]).concat([["10:38:24","Possible gait anomaly detected","Cue activated"],["10:21:09","Gait anomaly detected","Cue activated"],["09:58:42","Possible FoG event recorded",""]]).map(r=>`<div><time>${r[0]}</time><span style="flex:1">${r[1]}</span>${r[2]?`<span class="tag ok">${r[2]}</span>`:""}</div>`).join("")}</div></div></div>
<div class="card"><h3>System Workflow</h3><div class="arch"><span>MPU6050</span><em>→</em><span>ESP32</span><em>→</em><span>Movement Data Processing</span><em>→</em><span>Computational Gait Anomaly Detection</span><em>→</em><span>Vibration Cue</span></div><div class="arch"><em>Event data only:</em><span>ESP32</span><em>→</em><span>Wi-Fi</span><em>→</em><span>Firebase</span><em>→</em><span>React Dashboard</span></div><p class="sub" style="margin:4px 0 0">Movement processing and detection run locally on the ESP32. Only detected-event information is sent to Firebase.</p></div>`},
ev:()=>{const L=E.filter(e=>(F.d=="All Dates"||e[1]==F.d)&&(F.t=="All Events"||e[3]==F.t)&&(F.s=="All Sessions"||e[7]==F.s)&&(F.c=="All"||e[6]==F.c));
return `<h2>Gait Events</h2><p class="sub">Review gait events recorded by the wearable system.</p>
<div class="card"><div class="fl"><label>Date Range${sel("fd",["All Dates","06 Oct 2026","05 Oct 2026"],F.d)}</label><label>Event Type${sel("ft",["All Events","Possible FoG","Gait Anomaly"],F.t)}</label><label>Session${sel("fs",["All Sessions","S024","S023","S022"],F.s)}</label><label>Cue Status${sel("fc",["All","Activated","Not Activated"],F.c)}</label></div></div>
<div class="card tw"><table><tr><th>Event ID</th><th>Date</th><th>Time</th><th>Event Type</th><th>Duration</th><th>Movement State</th><th>Cue Status</th><th>Status</th><th>Action</th></tr>${L.map(e=>`<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td>${e[2]}</td><td>${ty(e[3])}</td><td>${e[4]} sec</td><td>${e[5]}</td><td>${cue(e[6])}</td><td>${rec}</td><td><button class="btn o" onclick="det('${e[0]}')">View Details</button></td></tr>`).join("")||'<tr><td colspan="9" style="color:var(--mut)">No events match the selected filters.</td></tr>'}</table></div>`},
se:()=>{const b=[1,2,2],m=2;return `<h2>Session Analysis</h2><p class="sub">Review basic gait-event information from controlled monitoring sessions.</p>
<div class="card"><div class="fl"><label>Session${sel("ss",["Session #024","Session #023","Session #022"],"Session #024")}</label><label>Date<span style="padding:6px 0;color:var(--ink);font-size:13px">06 Oct 2026</span></label><label>Duration<span style="padding:6px 0;color:var(--ink);font-size:13px">45 minutes</span></label></div></div>
<div class="grid k4"><div class="card kpi"><span>Session Duration</span><b>45 min</b></div><div class="card kpi g"><span>Detected Events</span><b>5</b></div><div class="card kpi a"><span>Possible FoG Events</span><b>2</b></div><div class="card kpi"><span>Sensory Cues</span><b>5</b></div></div>
<div class="grid two2"><div class="card"><h3>Session Event Timeline</h3><div class="tl">${[["10:00","Device Connected / Monitoring Active",""],["10:12","Monitoring",""],["10:21","Gait Anomaly Detected","f"],["10:21","Sensory Cue Activated","c"],["10:38","Possible FoG Event","f"],["10:38","Sensory Cue Activated","c"],["10:45","Device Disconnected / Monitoring Ended",""]].map(r=>`<div class="${r[2]}"><time>${r[0]}</time>${r[1]}</div>`).join("")}</div></div>
<div><div class="card"><h3>Event Distribution</h3>${[["Possible FoG",2,"var(--amb)"],["Other Gait Anomaly",3,"var(--teal)"]].map(r=>`<div style="margin-bottom:9px"><div class="row" style="border:0;padding:0 0 3px"><span>${r[0]}</span><b>${r[1]}</b></div><div style="background:var(--bg);height:12px;border-radius:3px"><div style="width:${r[1]/5*100}%;height:100%;background:${r[2]};border-radius:3px"></div></div></div>`).join("")}</div>
<div class="card"><h3>Detected Events Over Session</h3><svg viewBox="0 0 300 150" width="100%"><g stroke="var(--line)"><line x1="30" x2="290" y1="120" y2="120"/><line x1="30" x2="290" y1="80" y2="80"/><line x1="30" x2="290" y1="40" y2="40"/></g><text x="14" y="124">0</text><text x="14" y="84">1</text><text x="14" y="44">2</text>${b.map((n,i)=>`<rect x="${55+i*85}" y="${120-n*40}" width="45" height="${n*40}" fill="var(--teal)" rx="2"/><text x="${50+i*85}" y="138">10:${["00","15","30"][i]}–${["15","30","45"][i]}</text>`).join("")}</svg></div></div></div>`},
ds:()=>`<h2>Device Status</h2><p class="sub">Current state of the wearable unit.</p><div class="card" style="max-width:420px">${dev()}</div>`,
st:()=>`<h2>Settings</h2><p class="sub">Prototype settings are not part of this mockup.</p>`};
function go(p){document.querySelectorAll("aside button").forEach(b=>b.classList.toggle("on",b.dataset.p==p));v.innerHTML=P[p]();$("#dr").classList.remove("on");v.scrollTop=0;
[["fd","d"],["ft","t"],["fs","s"],["fc","c"]].forEach(([i,k])=>{const el=$("#"+i);if(el)el.onchange=()=>{F[k]=el.value;go("ev")}})}
document.querySelectorAll("aside button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function det(id){const e=E.find(x=>x[0]==id),d=$("#dr");
d.innerHTML=`<h2>${e[0]}<button class="x" onclick="document.getElementById('dr').classList.remove('on')">×</button></h2>${[["Event ID",e[0]],["Event Type",e[3]],["Date",e[1]],["Time",e[2]],["Duration",e[4]+" seconds"],["Movement State",e[5]],["Sensory Cue",e[6]],["Device","ESP32-GAIT-01"],["Firebase Status","Recorded"]].map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}
<h3 style="margin:16px 0 6px;font-size:12px;color:var(--mut);text-transform:uppercase">Event Movement Snapshot</h3>
<svg viewBox="0 0 320 140" width="100%"><rect x="110" y="10" width="100" height="100" fill="var(--ambL)"/><g stroke="var(--line)"><line x1="10" x2="310" y1="110" y2="110"/></g>
<polyline fill="none" stroke="var(--teal)" stroke-width="2" points="10,60 30,40 50,75 70,35 90,70 110,50 130,88 150,92 170,90 190,94 210,86 230,45 250,72 270,38 290,68 310,50"/>
<text x="38" y="128">Before</text><text x="135" y="128" style="fill:var(--amb);font-weight:600">Detected Event</text><text x="250" y="128">After</text></svg>
<p class="sub" style="margin-top:6px">Summary of recorded movement around the event, not a live sensor stream.</p>`;d.classList.add("on")}
go("ov");
</script></body></html>
